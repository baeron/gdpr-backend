# Azure Pipelines CI/CD for NestJS Backend
# GDPR Audit Backend API

parameters:
  - name: runProdOnly
    type: boolean
    default: false
  - name: enableRedis
    type: boolean
    default: false
    displayName: 'Enable Redis/BullMQ queue (requires more RAM)'

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '*.md'
      - '.github/**'

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '20.x'
  npmCacheFolder: $(Pipeline.Workspace)/.npm
  defaultWorkerDeployEnabled: 'false'
  ${{ if eq(parameters.enableRedis, true) }}:
    defaultQueueType: 'redis'
  ${{ else }}:
    defaultQueueType: 'postgres'

stages:
  # ============================================
  # Stage 1: Build & Test
  # ============================================
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      # # Lint job

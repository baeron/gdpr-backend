      #         restoreKeys: |
      #           npm | "$(Agent.OS)"
      #         path: $(npmCacheFolder)

      #     - script: |
      #         npm ci --cache $(npmCacheFolder)
      #         chmod -R +x node_modules/.bin
      #       displayName: 'Install dependencies'

      #     - script: npx prisma generate
      #       displayName: 'Generate Prisma client'

      #     # - script: npm run lint
      #     #   displayName: 'Run ESLint'

      # # Format check job
      # - job: Format
      #   displayName: 'Format Check'
      #   pool:
      #     vmImage: 'ubuntu-latest'
      #   steps:
      #     - task: NodeTool@0
      #       displayName: 'Install Node.js'
      #       inputs:
      #         versionSpec: $(nodeVersion)

      #     - task: Cache@2
      #       displayName: 'Cache npm packages'
      #       inputs:
      #         key: 'npm | "$(Agent.OS)" | package-lock.json'
      #         restoreKeys: |
      #           npm | "$(Agent.OS)"
      #         path: $(npmCacheFolder)

      #     - script: |
      #         npm ci --cache $(npmCacheFolder)
      #         chmod -R +x node_modules/.bin
      #       displayName: 'Install dependencies'

      #     - script: npx prisma generate
      #       displayName: 'Generate Prisma client'

      #     # - script: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      #     #   displayName: 'Check code formatting'

      # Unit Tests job
      - job: Test
        displayName: 'Unit Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache npm packages'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npmCacheFolder)

          - script: |
              npm ci --cache $(npmCacheFolder)
              chmod -R +x node_modules/.bin
            displayName: 'Install dependencies'

          - script: npx prisma generate
            displayName: 'Generate Prisma client'

          - script: npm audit --audit-level=high || true
            displayName: 'Security audit (npm)'

          - script: npm run test:cov
            displayName: 'Run unit tests with coverage'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
            condition: succeededOrFailed()

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit.xml'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()

      # Build job
      - job: BuildApp
        displayName: 'Build Application'
        dependsOn:
          # - Lint
          # - Format
          - Test
        condition: succeededOrFailed()
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache npm packages'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npmCacheFolder)

          - script: |
              npm ci --cache $(npmCacheFolder)
              chmod -R +x node_modules/.bin
            displayName: 'Install dependencies'

          - script: npx prisma generate
            displayName: 'Generate Prisma client'

          - script: npm run build
            displayName: 'Build application'

          - publish: $(System.DefaultWorkingDirectory)/dist
            artifact: dist
            displayName: 'Publish build artifact'

      # E2E Tests job
      - job: E2E
        displayName: 'E2E Tests'
        dependsOn: BuildApp
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache npm packages'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npmCacheFolder)

          - script: |
              npm ci --cache $(npmCacheFolder)
              chmod -R +x node_modules/.bin
            displayName: 'Install dependencies'

          - script: npx prisma generate
            displayName: 'Generate Prisma client'

          - download: current
            artifact: dist
            displayName: 'Download build artifact'

          - script: mv $(Pipeline.Workspace)/dist $(System.DefaultWorkingDirectory)/dist
            displayName: 'Restore dist artifact'

          - script: npm run test:e2e
            displayName: 'Run E2E tests'

  # ============================================
  # Stage 2: Deploy to PROD (Contabo, manual approval required)
  # ============================================
  # There is no separate DEV deploy: the old DeployDev stage targeted the
  # retired Vultr host and, on a shared box, ran `docker volume prune` and
  # `down` on the prod stack. PRs are validated by the Build stage only.
  #
  # Variable group `contabo-deployment` (set up once in Pipelines -> Library):
  #   CONTABO_HOST         167.86.116.58
  #   CONTABO_SSH_USER     user with docker rights on the host (e.g. root)
  #   CONTABO_SSH_KEY      secret: private deploy key, base64-encoded
  #   CONTABO_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`, base64-
  #                        encoded, verified against the host's own key:
  #                        SHA256:qEiVrWq4fbZJzUSHMyJ3OOyODqPDByBm4ojXO9xdMq8
  #
  # .env.production on the server is server-managed and never written here;
  # scripts/deploy-prod.sh refuses to deploy when a required key is missing.
  - stage: DeployProd
    displayName: 'Deploy to PROD (Contabo)'
    dependsOn: Build
    condition: >
      and(
        succeeded(),
        or(
          eq(${{ parameters.runProdOnly }}, true),
          eq(variables['Build.SourceBranch'], 'refs/heads/main')
        )
      )
    variables:
      - group: contabo-deployment
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to PROD Environment'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production' # Approval check configured on the environment
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    set -euo pipefail
                    mkdir -p ~/.ssh
                    echo "$(CONTABO_SSH_KEY)" | base64 -d > ~/.ssh/deploy_key
                    chmod 600 ~/.ssh/deploy_key
                    # Pinned host key: no ssh-keyscan at deploy time, so a
                    # spoofed host is rejected instead of trusted.
                    echo "$(CONTABO_KNOWN_HOSTS)" | base64 -d > ~/.ssh/known_hosts
                    chmod 644 ~/.ssh/known_hosts
                  displayName: 'Setup SSH key and pinned host key'

                - script: |
                    set -euo pipefail
                    SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
                    # Server-side state is excluded so --delete never removes it.
                    rsync -az --delete \
                      --exclude '.git/' --exclude 'node_modules/' --exclude 'dist/' \
                      --exclude 'coverage/' --exclude 'tests/load/results/' \
                      --exclude '.env' --exclude '.env.*' \
                      --exclude 'backups/' --exclude '.deployed-release*' \
                      --exclude '.claude/' --exclude 'gcp-service-account.json' \
                      -e "$SSH" \
                      ./ "$(CONTABO_SSH_USER)@$(CONTABO_HOST):/opt/gdpr-backend/"
                  displayName: 'Copy release to server'

                - script: |
                    set -euo pipefail
                    # Release tag = build id + short commit: unique, traceable
                    # to the commit, and a valid docker tag.
                    RELEASE="$(Build.BuildId)-$(echo '$(Build.SourceVersion)' | cut -c1-8)"
                    ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                      -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
                      "$(CONTABO_SSH_USER)@$(CONTABO_HOST)" \
                      "cd /opt/gdpr-backend && bash scripts/deploy-prod.sh '$RELEASE'"
                  displayName: 'Deploy (backup, build, migrate, swap, health check)'

                - script: |
                    set -euo pipefail
                    for i in $(seq 1 10); do
                      if curl -sf https://api.policytracker.eu/api/health; then
                        echo; echo "Public health check passed."; exit 0
                      fi
                      sleep 6
                    done
                    echo "Public endpoint https://api.policytracker.eu/api/health is not healthy" >&2
                    exit 1
                  displayName: 'Public health check'

  - stage: DeployCloudRunWorker
    displayName: 'Deploy Cloud Run Worker'
    dependsOn: DeployProd
    condition: >
      and(
        succeeded(),
        or(
          eq(variables['WORKER_DEPLOY_ENABLED'], 'true'),
          eq(variables['defaultWorkerDeployEnabled'], 'true')
        )
      )
    variables:
      - group: gdpr-secrets-prod
      - name: GCP_PROJECT_ID
        value: 'gdpr-scanner-worker'
      - name: GCP_REGION
        value: 'europe-west1'
      - name: CLOUD_RUN_SERVICE
        value: 'gdpr-scanner-worker'
    jobs:
      - deployment: DeployWorker
        displayName: 'Deploy to Google Cloud Run'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'cloud-run-worker'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: DownloadSecureFile@1
                  name: gcpServiceAccount
                  displayName: 'Download GCP Service Account Key'
                  inputs:
                    secureFile: 'gcp-service-account.json'

                - script: |
                    # Install gcloud CLI
                    echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
                    curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
                    sudo apt-get update && sudo apt-get install -y google-cloud-sdk
                  displayName: 'Install gcloud CLI'

                - script: |
                    # Authenticate with GCP
                    gcloud auth activate-service-account --key-file=$(gcpServiceAccount.secureFilePath)
                    gcloud config set project $(GCP_PROJECT_ID)
                  displayName: 'Authenticate with GCP'

                - script: |
                    DATABASE_URL="postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@45.63.119.28:5432/$(POSTGRES_DB)?schema=public"

                    gcloud run deploy $(CLOUD_RUN_SERVICE) \
                      --source . \
                      --region=$(GCP_REGION) \
                      --platform=managed \
                      --no-allow-unauthenticated \
                      --set-env-vars="DATABASE_URL=${DATABASE_URL},WORKER_AUTH_TOKEN=$(WORKER_AUTH_TOKEN),NODE_ENV=production" \
                      --max-instances=5 \
                      --min-instances=0 \
                      --memory=2Gi \
                      --cpu=1 \
                      --timeout=300s \
                      --concurrency=1
                  displayName: 'Deploy to Cloud Run'

                - script: |
                    SERVICE_URL=$(gcloud run services describe $(CLOUD_RUN_SERVICE) \
                      --region=$(GCP_REGION) \
                      --format='value(status.url)')

                    echo "Testing Cloud Run service at: ${SERVICE_URL}/health"
                    curl -f "${SERVICE_URL}/health" || exit 1
                    echo "Cloud Run Worker deployment successful!"
                  displayName: 'Test Cloud Run Deployment'
